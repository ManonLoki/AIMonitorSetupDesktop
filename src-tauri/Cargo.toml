[package]
name = "ai-monitor-setup"
version = "1.0.5"
description = "AI monitor desktop application"
authors = ["ai-monitor-setup contributors"]
edition = "2024"

[lib]
name = "ai_monitor_setup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
if-addrs = "0.15.0"
mdns-sd = "0.20.2"
reqwest = { version = "0.12.22", features = ["json", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
