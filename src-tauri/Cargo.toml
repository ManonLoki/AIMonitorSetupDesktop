[package]
name = "ai-monitor-setup"
version = "2.0.5"
description = "AI monitor desktop application"
authors = ["ManonLoki"]
edition = "2024"
license-file = "../LICENSE"
repository = "https://github.com/ManonLoki/AIMonitorSetupDesktop.git"

[[bin]]
name = "AIMonitor"
path = "src/main.rs"

[lib]
name = "ai_monitor_setup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
if-addrs = "0.15.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
mdns-sd = "0.20.2"
reqwest = { version = "0.12.22", features = ["blocking", "json", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-single-instance = "2.4.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
