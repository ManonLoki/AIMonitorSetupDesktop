[package]
name = "ai-monitor-setup"
version = "2.2.1"
description = "AI monitor desktop application"
authors = ["ManonLoki"]
edition = "2024"
license-file = "../LICENSE"
repository = "https://github.com/ManonLoki/AIMonitorSetupDesktop.git"

[[bin]]
name = "AIMonitor"
path = "src/main.rs"

[lib]
name = "ai_monitor_setup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4.6.4", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
if-addrs = "0.15.0"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
mdns-sd = "0.20.2"
reqwest = { version = "0.12.22", features = ["blocking", "json", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.4.3"
tokio = { version = "1.53.1", features = ["net"] }
uuid = { version = "1.23.4", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
